<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Men’s League</title>

  <link
    rel="stylesheet"
    href="styles.css?v=16"
  >

  <script
    src="mens-data2026.js?v=1"
    defer
  ></script>

  <script
    src="mens-home.js?v=1"
    defer
  ></script>
</head>

<body class="league-home-page mens-home-page">

  <header class="top-bar">
    <a
      href="index.html"
      aria-label="Return to the Lorette Curling Club home page"
    >
      <img
        src="lcc-logo.png"
        alt="Lorette Curling Club"
        class="top-bar-logo"
      >
    </a>
  </header>

  <main class="container team-page">

    <header class="league-home-header">
      <img
        src="lcc-logo-mens.jpg?v=1"
        alt="Men’s League"
        class="league-logo"
      >
    </header>

    <section class="card">
      <h2>League Summary</h2>

      <p>
        <strong>2026/27 Men’s League</strong>
      </p>

      <p>
        <strong>Thursday Evenings:</strong>
        7:00 PM and 9:15 PM draws.
      </p>

      <p>
        <strong>Season:</strong>
        Weekly from October through February.
      </p>

      <p>
        <strong>Scoring:</strong>
        Win 10 points, Loss 5 points and Tie 7 points.
      </p>
    </section>

    <section class="card upcoming-week-card">
      <div class="upcoming-week-card-heading">
        <h2>Upcoming Week</h2>

        <span
          id="upcoming-week-phase"
          class="upcoming-week-phase"
          hidden
        >
          Regular Season
        </span>
      </div>

      <div
        id="upcoming-week-container"
        aria-live="polite"
      >
        <div class="upcoming-week-message">
          <p>
            Loading the upcoming Men’s League games…
          </p>
        </div>
      </div>
    </section>

  </main>

  <footer
    class="bottom-bar-four"
    aria-label="Men’s League navigation"
  >
    <a
      href="index.html"
      class="bottom-bar-button-small"
    >
      <span class="bottom-bar-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="
              M3 11.5
              12 4
              21 11.5
              V20
              H15
              V14
              H9
              V20
              H3
              Z
            "
          />
        </svg>
      </span>

      <span class="bottom-bar-label">
        Home
      </span>
    </a>

    <a
      href="mens.html"
      class="bottom-bar-button-small active"
      aria-current="page"
    >
      <span class="bottom-bar-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="7"
            r="3"
          />

          <path
            d="
              M6 20
              C6 15.5 8.5 13 12 13
              C15.5 13 18 15.5 18 20
            "
          />
        </svg>
      </span>

      <span class="bottom-bar-label">
        Men’s
      </span>
    </a>

    <a
      href="mens-schedule2026.html"
      class="bottom-bar-button-small"
    >
      <span class="bottom-bar-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="2"
          />

          <path d="M3 10H21" />
          <path d="M8 3V7" />
          <path d="M16 3V7" />
          <path d="M7 14H10" />
          <path d="M14 14H17" />
          <path d="M7 18H10" />
          <path d="M14 18H17" />
        </svg>
      </span>

      <span class="bottom-bar-label">
        Schedule
      </span>
    </a>

    <a
      href="mens-standings2026.html"
      class="bottom-bar-button-small"
    >
      <span class="bottom-bar-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 20V12" />
          <path d="M12 20V4" />
          <path d="M19 20V8" />
          <path d="M2 20H22" />
        </svg>
      </span>

      <span class="bottom-bar-label">
        Standings
      </span>
    </a>
  </footer>

</body>
</html>
