<!DOCTYPE html>
<html lang="en">

    content="width=device-width, initial-scale=1.0"

  <script

    defer

  <script

    defer

<body class="league-schedule-page mens-schedule-page">

  <header class="schedule-month-header">
    <nav
      class="schedule-month-nav"
      aria-label="Men’s League schedule months"
    >
      <button
        type="button"
        class="schedule-month-button active"
        data-month="october"
        aria-pressed="true"
      >
        October
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="november"
        aria-pressed="false"
      >
        November
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="december"
        aria-pressed="false"
      >
        December
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="january"
        aria-pressed="false"
      >
        January
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="february"
        aria-pressed="false"
      >
        February
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="march"
        aria-pressed="false"
      >
        March
      </button>
    </nav>
  </header>

  <main
    id="top"
    class="schedule-page-content"
  >
    <section class="schedule-page-heading schedule-logo-heading">
      <img
        src="lcc-logo-mens.jpg?v=1"
        alt="Men’s League"
        class="schedule-league-logo"
      >

      <p>
        2026–27 Schedule
      </p>
    </section>

    <div
      id="schedule-container"
      aria-live="polite"
    >
      <section class="schedule-message-card">
        <p>
          Loading the Men’s League schedule…
        </p>
      </section>
    </div>
  </main>

  <footer
    class="league-footer"
    aria-label="Men’s League navigation"
  >
    <a
      href="index.html"
      class="league-footer-link"
    >
      <span class="league-footer-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="
              M3 11.5
              12 4
              21 11.5
              V20
              H15
              V14
              H9
              V20
              H3
              Z
            "
          />
        </svg>
      </span>

      <span class="league-footer-label">
        Home
      </span>
    </a>

    <a
      href="mens.html"
      class="league-footer-link"
    >
      <span class="league-footer-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="8"
            cy="7"
            r="3"
          />

          <circle
            cx="16"
            cy="7"
            r="3"
          />

          <path
            d="
              M3 20
              C3 15.8 5.2 13 8 13
              C10.8 13 13 15.8 13 20
            "
          />

          <path
            d="
              M11 20
              C11 15.8 13.2 13 16 13
              C18.8 13 21 15.8 21 20
            "
          />
        </svg>
      </span>

      <span class="league-footer-label">
        Men’s
      </span>
    </a>

    <a
      href="mens-schedule2026.html"
      class="league-footer-link active"
      aria-current="page"
    >
      <span class="league-footer-icon">
        <svg
          width="27"
          height="27"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="2"
          />

          <path d="M3 10H21" />
          <path d="M8 3V7" />
          <path d="M16 3V7" />
          <path d="M7 14H10" />
          <path d="M14 14H17" />
          <path d="M7 18H10" />
          <path d="M14 18H17" />

    <a

        Standings
      </span>
    </a>
  </footer>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      () => {
        const monthButtons =
          Array.from(
            document.querySelectorAll(
              ".schedule-month-button"
            )
          );

        const scheduleContainer =
          document.getElementById(
            "schedule-container"
          );

        function setActiveMonth(
          selectedButton
        ) {
          monthButtons.forEach((button) => {
            const isActive =
              button === selectedButton;

            button.classList.toggle(
              "active",
              isActive
            );

            button.setAttribute(
              "aria-pressed",
              String(isActive)
            );
          });
        }

        function findMonthSection(
          monthName
        ) {
          return document.querySelector(
            `#schedule-container #${monthName}`
          );
        }

        monthButtons.forEach((button) => {
          button.addEventListener(
            "click",
            () => {
              const monthName =
                button.dataset.month;

              const monthSection =
                findMonthSection(
                  monthName
                );

              if (!monthSection) {
                return;
              }

              setActiveMonth(button);

              monthSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });
            }
          );
        });

        const observer =
          new MutationObserver(() => {
            const firstAvailableButton =
              monthButtons.find((button) => {
                return Boolean(
                  findMonthSection(
                    button.dataset.month
                  )
                );
              });

            if (firstAvailableButton) {
              setActiveMonth(
                firstAvailableButton
              );
            }
          });

        if (scheduleContainer) {
          observer.observe(
            scheduleContainer,
            {
              childList: true,
              subtree: true
            }
          );
        }
      }
    );
  </script>

</body>
</html>
