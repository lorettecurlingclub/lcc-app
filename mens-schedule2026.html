<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Men’s League Schedule</title>

  <link
    rel="stylesheet"
    href="styles.css?v=15"
  >

  <script
    src="mens-data2026.js?v=1"
    defer
  ></script>

  <script
    src="mens-schedule.js?v=2"
    defer
  ></script>
</head>

<body class="league-schedule-page mens-schedule-page">

  <header class="schedule-month-header">
    <nav
      class="schedule-month-nav"
      aria-label="Men’s League schedule months"
    >
      <button
        type="button"
        class="schedule-month-button active"
        data-month="october"
      >
        October
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="november"
      >
        November
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="december"
      >
        December
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="january"
      >
        January
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="february"
      >
        February
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="march"
      >
        March
      </button>
    </nav>
  </header>

  <main
    id="top"
    class="schedule-page-content"
  >
    <section
      class="
        schedule-page-heading
        schedule-logo-heading
      "
    >
      <img
        src="lcc-logo-mens.jpg?v=1"
        alt="Men’s League"
        class="schedule-league-logo"
      >

      <p>2026–27 Schedule</p>
    </section>

    <div
      id="schedule-container"
      aria-live="polite"
    >
      <section class="schedule-message-card">
        <p>
          Loading the Men’s League schedule…
        </p>
      </section>
    </div>
  </main>

  <footer
    class="league-footer"
    aria-label="Men’s League navigation"
  >
    <a
      href="index.html"
      class="league-footer-link"
    >
      <span class="league-footer-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            d="
              M3 11.5
              12 4
              21 11.5
              V20
              H15
              V14
              H9
              V20
              H3
              Z
            "
          />
        </svg>
      </span>

      <span class="league-footer-label">
        Home
      </span>
    </a>

    <a
      href="mens.html"
      class="league-footer-link"
    >
      <span class="league-footer-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <circle cx="12" cy="7" r="3" />

          <path
            d="
              M6 20
              C6 15.5 8.5 13 12 13
              C15.5 13 18 15.5 18 20
            "
          />
        </svg>
      </span>

      <span class="league-footer-label">
        Men’s
      </span>
    </a>

    <a
      href="mens-schedule2026.html"
      class="league-footer-link active"
      aria-current="page"
    >
      <span class="league-footer-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="2"
          />

          <path d="M3 10H21" />
          <path d="M8 3V7" />
          <path d="M16 3V7" />
          <path d="M7 14H10" />
          <path d="M14 14H17" />
          <path d="M7 18H10" />
          <path d="M14 18H17" />
        </svg>
      </span>

      <span class="league-footer-label">
        Schedule
      </span>
    </a>

    <a
      href="mens-standings2026.html"
      class="league-footer-link"
    >
      <span class="league-footer-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M5 20V12" />
          <path d="M12 20V4" />
          <path d="M19 20V8" />
          <path d="M2 20H22" />
        </svg>
      </span>

      <span class="league-footer-label">
        Standings
      </span>
    </a>
  </footer>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      () => {
        const scheduleContainer =
          document.getElementById(
            "schedule-container"
          );

        const monthButtons = Array.from(
          document.querySelectorAll(
            ".schedule-month-button"
          )
        );

        function setActiveMonth(monthName) {
          monthButtons.forEach((button) => {
            const isActive =
              button.dataset.month === monthName;

            button.classList.toggle(
              "active",
              isActive
            );

            button.setAttribute(
              "aria-pressed",
              String(isActive)
            );
          });
        }

        function findMonthSection(monthName) {
          if (!scheduleContainer) {
            return null;
          }

          return scheduleContainer.querySelector(
            `[data-schedule-month="${monthName}"]`
          );
        }

        monthButtons.forEach((button) => {
          button.addEventListener(
            "click",
            () => {
              const monthName =
                button.dataset.month;

              const monthSection =
                findMonthSection(monthName);

              if (!monthSection) {
                return;
              }

              setActiveMonth(monthName);

              monthSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });
            }
          );
        });

        function updateActiveMonth() {
          if (!scheduleContainer) {
            return;
          }

          const monthSections = Array.from(
            scheduleContainer.querySelectorAll(
              "[data-schedule-month]"
            )
          );

          if (monthSections.length === 0) {
            return;
          }

          const headerOffset = 135;

          let activeSection =
            monthSections[0];

          monthSections.forEach((section) => {
            const sectionTop =
              section.getBoundingClientRect().top;

            if (sectionTop <= headerOffset) {
              activeSection = section;
            }
          });

          setActiveMonth(
            activeSection.dataset.scheduleMonth
          );
        }

        let scrollUpdatePending = false;

        window.addEventListener(
          "scroll",
          () => {
            if (scrollUpdatePending) {
              return;
            }

            scrollUpdatePending = true;

            window.requestAnimationFrame(() => {
              updateActiveMonth();
              scrollUpdatePending = false;
            });
          },
          {
            passive: true
          }
        );

        if (scheduleContainer) {
          const observer =
            new MutationObserver(() => {
              updateActiveMonth();
            });

          observer.observe(
            scheduleContainer,
            {
              childList: true,
              subtree: true
            }
          );
        }
      }
    );
  </script>
</body>
</html>
