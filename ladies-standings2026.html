<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1f6f4a"
  >

  <title>Ladies League Standings | Lorette Curling Club</title>

  <link rel="stylesheet" href="styles.css?v=14">

  <script src="ladies-data2026.js?v=1" defer></script>
  <script src="ladies-standings.js?v=3" defer></script>
</head>

<body class="league-standings-page ladies-standings-page">

  <!-- Standard logo header used on non-schedule pages -->
  <header class="top-bar">
    <img
      src="lcc-logo.png"
      alt="Lorette Curling Club"
      class="top-bar-logo"
    >
  </header>

  <main class="standings-page-content">

    <header class="header standings-page-header">
      <img
        src="lcc-logo-ladies.jpg?v=1"
        alt="Ladies League"
        class="league-logo"
      >
    </header>

    <div
      id="standings-container"
      aria-live="polite"
    >
      <section class="standings-card standings-loading-card">
        <p>Loading the Ladies League standings…</p>
      </section>
    </div>

  </main>

  <!-- Standard four-button league footer -->
  <footer
    class="league-footer"
    aria-label="Ladies League navigation"
  >

    <a
      class="league-footer-link"
      href="index.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span class="league-footer-label">
        Home
      </span>
    </a>

    <a
      class="league-footer-link"
      href="ladies.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ♙
      </span>

      <span class="league-footer-label">
        Ladies
      </span>
    </a>

    <a
      class="league-footer-link"
      href="ladies-schedule2026.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ▦
      </span>

      <span class="league-footer-label">
        Schedule
      </span>
    </a>

    <a
      class="league-footer-link active"
      href="ladies-standings2026.html"
      aria-current="page"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ☷
      </span>

      <span class="league-footer-label">
        Standings
      </span>
    </a>

  </footer>

</body>
</html>
