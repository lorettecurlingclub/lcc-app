<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ladies League</title>

  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="manifest" href="manifest.json" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Curling" />
  <meta name="theme-color" content="#1f6f4a" />

  <link rel="apple-touch-icon" href="lcc-logo-app3.jpg" />

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/lcc-app/sw.js");
      });
    }
  </script>
</head>

<body>
  <div class="container">

    <header class="top-bar">
      <img
        src="lcc-logo.png"
        alt="Lorette Curling Club logo"
        class="top-bar-logo"
      />
    </header>

    <header class="header">
      <img
        src="lcc-logo-ladies.jpg?v=1"
        alt="Ladies League"
        class="league-logo"
      />
    </header>

    <main>

      <section class="card upcoming-week-card">
        <h2>Upcoming Week</h2>

        <div id="upcoming-week-content">
          <p>
            Waiting for the 2026/27 Ladies League schedule.
          </p>
        </div>
      </section>

      <section class="card">
        <h2>League Summary</h2>

        <p><strong>Season:</strong> 2026/27</p>
        <p><strong>Teams:</strong> 9</p>
        <p><strong>Scoring:</strong> Win = 10, Loss = 5, Tie = 7</p>

        <p>
          <strong>Season Status:</strong>
          Waiting for 2026/27 Ladies League information and schedule!
        </p>
      </section>

    </main>
  </div>

  <footer class="bottom-bar bottom-bar-three">

    <a
      href="index.html"
      class="bottom-bar-button bottom-bar-button-mobile"
      aria-label="Home"
    >
      <svg
        class="bottom-bar-svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5.5 10.5V20h13v-9.5"></path>
        <path d="M9.5 20v-6h5v6"></path>
      </svg>

      <span class="bottom-bar-label">Home</span>
    </a>

    <a
      href="ladies-schedule2026.html"
      class="bottom-bar-button bottom-bar-button-mobile"
      aria-label="Ladies Schedule"
    >
      <svg
        class="bottom-bar-svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M7 3v4"></path>
        <path d="M17 3v4"></path>
        <path d="M3 10h18"></path>
        <path d="M7 14h2"></path>
        <path d="M11 14h2"></path>
        <path d="M15 14h2"></path>
        <path d="M7 18h2"></path>
        <path d="M11 18h2"></path>
      </svg>

      <span class="bottom-bar-label">Schedule</span>
    </a>

    <a
      href="ladies-standings2026.html"
      class="bottom-bar-button bottom-bar-button-mobile"
      aria-label="Ladies Standings"
    >
      <svg
        class="bottom-bar-svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M5 20v-6h4v6"></path>
        <path d="M10 20V9h4v11"></path>
        <path d="M15 20V4h4v16"></path>
        <path d="M3 20h18"></path>
      </svg>

      <span class="bottom-bar-label">Standings</span>
    </a>

  </footer>

  <script>
    /*
      Add the Ladies League schedule here once it is available.

      Each week will follow this structure:

      {
        date: "2026-10-05T19:00:00",
        displayDate: "Monday, October 5",
        lateDrawStart: "2026-10-05T21:15:00",
        earlyDraw: [
          {
            sheet: 1,
            team1: "Team Name",
            team2: "Team Name"
          }
        ],
        lateDraw: [
          {
            sheet: 1,
            team1: "Team Name",
            team2: "Team Name"
          }
        ],
        fiftyFifty: "Team Name"
      }
    */

    const ladiesSchedule = [];

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createDrawHTML(title, games) {
      if (!games || games.length === 0) {
        return "";
      }

      const gameRows = games.map((game) => {
        return `
          <div class="upcoming-week-game">
            <span class="upcoming-week-sheet">
              Sheet ${escapeHTML(game.sheet)}
            </span>

            <span class="upcoming-week-matchup">
              ${escapeHTML(game.team1)}
              <span class="upcoming-week-vs">vs</span>
              ${escapeHTML(game.team2)}
            </span>
          </div>
        `;
      }).join("");

      return `
        <div class="upcoming-week-draw">
          <h3>${escapeHTML(title)}</h3>
          ${gameRows}
        </div>
      `;
    }

    function getUpcomingWeek(schedule, currentTime) {
      return schedule.find((week) => {
        const rolloverTime = new Date(week.lateDrawStart);
        return currentTime < rolloverTime;
      });
    }

    function displayUpcomingWeek() {
      const content = document.getElementById("upcoming-week-content");

      if (!content) {
        return;
      }

      if (!Array.isArray(ladiesSchedule) || ladiesSchedule.length === 0) {
        content.innerHTML = `
          <p>Waiting for the 2026/27 Ladies League schedule.</p>
        `;
        return;
      }

      const currentTime = new Date();
      const upcomingWeek = getUpcomingWeek(ladiesSchedule, currentTime);

      if (!upcomingWeek) {
        content.innerHTML = `
          <p>The 2026/27 Ladies League schedule is complete.</p>
        `;
        return;
      }

      const earlyDrawHTML = createDrawHTML(
        "Early Draw",
        upcomingWeek.earlyDraw
      );

      const lateDrawHTML = createDrawHTML(
        "Late Draw",
        upcomingWeek.lateDraw
      );

      const fiftyFiftyHTML = upcomingWeek.fiftyFifty
        ? `
          <div class="upcoming-week-fifty-fifty">
            <strong>50/50 Team:</strong>
            ${escapeHTML(upcomingWeek.fiftyFifty)}
          </div>
        `
        : "";

      content.innerHTML = `
        <p class="upcoming-week-date">
          <strong>${escapeHTML(upcomingWeek.displayDate)}</strong>
        </p>

        ${earlyDrawHTML}
        ${lateDrawHTML}
        ${fiftyFiftyHTML}
      `;
    }

    document.addEventListener("DOMContentLoaded", displayUpcomingWeek);
  </script>
</body>
</html>
