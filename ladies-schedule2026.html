<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1f6f4a"
  >

  <title>Ladies League Schedule | Lorette Curling Club</title>

  <link rel="stylesheet" href="styles.css?v=13">
</head>

<body class="league-schedule-page ladies-schedule-page">

  <!-- Fixed schedule-only month header -->
  <header
    class="schedule-month-header"
    aria-label="Schedule month navigation"
  >
    <nav class="schedule-month-nav">

      <button
        type="button"
        class="schedule-month-button active"
        data-month="October"
      >
        October
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="November"
      >
        November
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="December"
      >
        December
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="January"
      >
        January
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="February"
      >
        February
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="March"
      >
        March
      </button>

    </nav>
  </header>

  <!-- Main schedule content -->
  <main class="schedule-page-content">

    <section class="schedule-page-heading schedule-logo-heading">
      <img
        src="lcc-logo-ladies.jpg?v=1"
        alt="Ladies League"
        class="schedule-league-logo"
      >

      <p>2026–27 Schedule</p>
    </section>

    <!-- Schedule generated by ladies-schedule.js -->
    <div
      id="schedule-container"
      aria-live="polite"
    ></div>

  </main>

  <!-- Fixed four-button footer -->
  <footer
    class="league-footer"
    aria-label="Ladies League navigation"
  >

    <a
      class="league-footer-link"
      href="index.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span class="league-footer-label">
        Home
      </span>
    </a>

    <a
      class="league-footer-link"
      href="ladies.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ♙
      </span>

      <span class="league-footer-label">
        Ladies
      </span>
    </a>

    <a
      class="league-footer-link active"
      href="ladies-schedule2026.html"
      aria-current="page"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ▦
      </span>

      <span class="league-footer-label">
        Schedule
      </span>
    </a>

    <a
      class="league-footer-link"
      href="ladies-standings2026.html"
    >
      <span
        class="league-footer-icon"
        aria-hidden="true"
      >
        ☷
      </span>

      <span class="league-footer-label">
        Standings
      </span>
    </a>

  </footer>

  <!-- League data and schedule renderer -->
  <script src="ladies-data2026.js?v=1"></script>
  <script src="ladies-schedule.js?v=1"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const monthButtons = document.querySelectorAll(
        ".schedule-month-button"
      );

      const scheduleContainer = document.getElementById(
        "schedule-container"
      );

      const normalizeText = (value) =>
        String(value || "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

      const normalizeMonth = (value) =>
        normalizeText(value);

      function findMonthSection(monthName) {
        const normalizedMonth = normalizeMonth(monthName);

        const possibleIds = [
          normalizedMonth,
          `${normalizedMonth}-2026`,
          `${normalizedMonth}-2027`,
          `month-${normalizedMonth}`
        ];

        for (const id of possibleIds) {
          const element = document.getElementById(id);

          if (element) {
            return element;
          }
        }

        const monthDataElement =
          scheduleContainer?.querySelector(
            `[data-month="${monthName}"],
             [data-month="${normalizedMonth}"],
             [data-schedule-month="${monthName}"],
             [data-schedule-month="${normalizedMonth}"]`
          );

        if (monthDataElement) {
          return monthDataElement;
        }

        const headings =
          scheduleContainer?.querySelectorAll(
            ".schedule-month-heading, h2, h3"
          ) || [];

        return Array.from(headings).find((heading) =>
          normalizeMonth(heading.textContent).includes(
            normalizedMonth
          )
        );
      }

      function setActiveMonth(monthName) {
        monthButtons.forEach((button) => {
          const isActive =
            normalizeMonth(button.dataset.month) ===
            normalizeMonth(monthName);

          button.classList.toggle("active", isActive);
        });
      }

      /*
        Adds a compact secondary style to the generated
        50/50 Team and Bye information without requiring
        those details to become the focus of each card.
      */

      function markSecondaryScheduleInformation() {
        if (!scheduleContainer) {
          return;
        }

        const candidates = scheduleContainer.querySelectorAll(
          "p, div, span"
        );

        candidates.forEach((element) => {
          const text = normalizeText(element.textContent);

          const isSecondaryInformation =
            text.startsWith("50/50 team:") ||
            text.startsWith("50/50:") ||
            text.startsWith("bye team:") ||
            text.startsWith("bye week:") ||
            text.startsWith("bye:");

          if (!isSecondaryInformation) {
            return;
          }

          const containsSmallerMatchingChild =
            Array.from(element.children).some((child) => {
              const childText = normalizeText(
                child.textContent
              );

              return (
                childText.startsWith("50/50 team:") ||
                childText.startsWith("50/50:") ||
                childText.startsWith("bye team:") ||
                childText.startsWith("bye week:") ||
                childText.startsWith("bye:")
              );
            });

          if (!containsSmallerMatchingChild) {
            element.classList.add(
              "schedule-secondary-information"
            );
          }
        });
      }

      monthButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const monthName = button.dataset.month;
          const monthSection = findMonthSection(monthName);

          if (!monthSection) {
            return;
          }

          setActiveMonth(monthName);

          const headerHeight =
            document.querySelector(
              ".schedule-month-header"
            )?.offsetHeight || 0;

          const targetPosition =
            monthSection.getBoundingClientRect().top +
            window.scrollY -
            headerHeight -
            12;

          window.scrollTo({
            top: targetPosition,
            behavior: "smooth"
          });
        });
      });

      markSecondaryScheduleInformation();

      if (scheduleContainer) {
        const scheduleObserver = new MutationObserver(() => {
          markSecondaryScheduleInformation();
        });

        scheduleObserver.observe(scheduleContainer, {
          childList: true,
          subtree: true
        });
      }
    });
  </script>

</body>
</html>
