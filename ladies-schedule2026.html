<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b3d2e"
  >

  <title>Ladies League Schedule | Lorette Curling Club</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="league-schedule-page">

  <!-- Fixed schedule-only month header -->
  <header class="schedule-month-header" aria-label="Schedule month navigation">
    <nav class="schedule-month-nav">
      <button
        type="button"
        class="schedule-month-button active"
        data-month="October"
      >
        October
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="November"
      >
        November
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="December"
      >
        December
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="January"
      >
        January
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="February"
      >
        February
      </button>

      <button
        type="button"
        class="schedule-month-button"
        data-month="March"
      >
        March
      </button>
    </nav>
  </header>

  <!-- Main schedule content -->
  <main class="schedule-page-content">

    <section class="schedule-page-heading">
      <h1>Ladies League</h1>
      <p>2026–27 Schedule</p>
    </section>

    <!-- Schedule generated by ladies-schedule.js -->
    <div id="schedule-container"></div>

  </main>

  <!-- Fixed four-button footer -->
  <footer class="league-footer" aria-label="Ladies League navigation">

    <a class="league-footer-link" href="index.html">
      <span class="league-footer-icon" aria-hidden="true">⌂</span>
      <span class="league-footer-label">Home</span>
    </a>

    <a class="league-footer-link" href="ladies.html">
      <span class="league-footer-icon" aria-hidden="true">♙</span>
      <span class="league-footer-label">Ladies</span>
    </a>

    <a
      class="league-footer-link active"
      href="ladies-schedule2026.html"
      aria-current="page"
    >
      <span class="league-footer-icon" aria-hidden="true">▦</span>
      <span class="league-footer-label">Schedule</span>
    </a>

    <a
      class="league-footer-link"
      href="ladies-standings2026.html"
    >
      <span class="league-footer-icon" aria-hidden="true">☷</span>
      <span class="league-footer-label">Standings</span>
    </a>

  </footer>

  <!-- League data and schedule renderer -->
  <script src="ladies-data2026.js"></script>
  <script src="ladies-schedule.js"></script>

  <!-- Schedule-only month navigation -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const monthButtons = document.querySelectorAll(
        ".schedule-month-button"
      );

      const normalizeMonth = (value) =>
        String(value || "")
          .trim()
          .toLowerCase();

      function findMonthSection(monthName) {
        const normalizedMonth = normalizeMonth(monthName);

        const possibleIds = [
          normalizedMonth,
          `${normalizedMonth}-2026`,
          `${normalizedMonth}-2027`,
          `month-${normalizedMonth}`
        ];

        for (const id of possibleIds) {
          const element = document.getElementById(id);

          if (element) {
            return element;
          }
        }

        const monthDataElement = document.querySelector(
          `[data-month="${monthName}"],
           [data-month="${normalizedMonth}"],
           [data-schedule-month="${monthName}"],
           [data-schedule-month="${normalizedMonth}"]`
        );

        if (monthDataElement) {
          return monthDataElement;
        }

        const headings = document.querySelectorAll(
          ".schedule-month-heading, h2, h3"
        );

        return Array.from(headings).find((heading) =>
          normalizeMonth(heading.textContent).includes(normalizedMonth)
        );
      }

      function setActiveMonth(monthName) {
        monthButtons.forEach((button) => {
          const isActive =
            normalizeMonth(button.dataset.month) ===
            normalizeMonth(monthName);

          button.classList.toggle("active", isActive);
        });
      }

      monthButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const monthName = button.dataset.month;
          const monthSection = findMonthSection(monthName);

          if (!monthSection) {
            return;
          }

          setActiveMonth(monthName);

          const headerHeight =
            document.querySelector(".schedule-month-header")
              ?.offsetHeight || 0;

          const targetPosition =
            monthSection.getBoundingClientRect().top +
            window.scrollY -
            headerHeight -
            12;

          window.scrollTo({
            top: targetPosition,
            behavior: "smooth"
          });
        });
      });
    });
  </script>

</body>
</html>
